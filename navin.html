<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Building Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #2a5298);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        
        .header {
            text-align: center;
            padding: 2rem 1rem;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .container {
            display: flex;
            flex: 1;
            padding: 2rem;
            gap: 2rem;
        }
        
        .viewer-container {
            flex: 1;
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            background: rgba(0, 0, 0, 0.2);
        }
        
        #viewer3d {
            width: 100%;
            height: 100%;
        }
        
        .controls {
            width: 300px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 1.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            height: fit-content;
        }
        
        .control-group {
            margin-bottom: 1.5rem;
        }
        
        .control-group h3 {
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 0.5rem;
        }
        
        .control-item {
            margin-bottom: 1rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        
        select, button {
            width: 100%;
            padding: 0.75rem;
            border-radius: 5px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        button {
            background: #4CAF50;
            color: white;
            margin-top: 0.5rem;
        }
        
        button:hover {
            background: #45a049;
            transform: translateY(-2px);
        }
        
        input[type="range"] {
            width: 100%;
        }
        
        .checkbox-container {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        
        .checkbox-container input {
            width: auto;
            margin-right: 10px;
        }
        
        .floor-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: bold;
            z-index: 10;
        }
        
        .status {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            font-size: 0.9rem;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
        }
        
        .demo-data {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }
        
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .controls {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>3D Building Visualization</h1>
        <p>View your architectural plans in 3D with multiple floors</p>
    </div>
    
    <div class="container">
        <div class="viewer-container">
            <div id="viewer3d"></div>
            <div class="floor-indicator">Floor: <span id="currentFloor">0</span></div>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <h3>View Controls</h3>
                <div class="control-item">
                    <label for="floorSelect">Select Floor</label>
                    <select id="floorSelect">
                        <option value="all">All Floors</option>
                        <option value="0">Ground Floor</option>
                        <option value="1">First Floor</option>
                        <option value="2">Second Floor</option>
                    </select>
                </div>
                <div class="control-item">
                    <label for="floorHeight">Floor Height: <span id="floorHeightValue">3</span>m</label>
                    <input type="range" id="floorHeight" min="1" max="10" step="0.5" value="3">
                </div>
                <div class="control-item">
                    <label for="wallHeight">Wall Height: <span id="wallHeightValue">2.5</span>m</label>
                    <input type="range" id="wallHeight" min="1" max="5" step="0.1" value="2.5">
                </div>
                <div class="checkbox-container">
                    <input type="checkbox" id="showLabels" checked>
                    <label for="showLabels">Show Room Labels</label>
                </div>
                <div class="checkbox-container">
                    <input type="checkbox" id="showGrid" checked>
                    <label for="showGrid">Show Grid</label>
                </div>
                <div class="checkbox-container">
                    <input type="checkbox" id="showWalls" checked>
                    <label for="showWalls">Show Walls</label>
                </div>
                <button id="resetView">Reset View</button>
            </div>
            
            <div class="control-group">
                <h3>Display Options</h3>
                <div class="control-item">
                    <label for="colorScheme">Color Scheme</label>
                    <select id="colorScheme">
                        <option value="byRoomType">By Room Type</option>
                        <option value="byFloor">By Floor</option>
                        <option value="monochrome">Monochrome</option>
                    </select>
                </div>
                <div class="control-item">
                    <label for="viewMode">View Mode</label>
                    <select id="viewMode">
                        <option value="solid">Solid</option>
                        <option value="wireframe">Wireframe</option>
                        <option value="transparent">Transparent</option>
                    </select>
                </div>
            </div>
            
            <div class="demo-data">
                <h3>Sample Data</h3>
                <p>This demo uses sample floor plan data. In your app, this would load from your JSON.</p>
            </div>
            
            <div class="status">
                <p>Use mouse to rotate, scroll to zoom, and right-click to pan.</p>
            </div>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // Main 3D Viewer Application
        class Building3DViewer {
            constructor() {
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.controls = null;
                this.rooms = [];
                this.floorHeight = 3;
                this.wallHeight = 2.5;
                this.currentFloor = 'all';
                this.showLabels = true;
                this.showGrid = true;
                this.showWalls = true;
                this.colorScheme = 'byRoomType';
                this.viewMode = 'solid';
                
                this.init();
                this.setupEventListeners();
                this.createSampleData();
                this.create3DVisualization();
            }
            
            init() {
                // Create Three.js scene
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x87CEEB); // Sky blue background
                
                // Create camera
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth * 0.7 / (window.innerHeight * 0.8), 0.1, 1000);
                this.camera.position.set(20, 15, 20);
                
                // Create renderer
                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth * 0.7, window.innerHeight * 0.8);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                document.getElementById('viewer3d').appendChild(this.renderer.domElement);
                
                // Add orbit controls
                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;
                
                // Add lighting
                const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
                this.scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(50, 50, 50);
                directionalLight.castShadow = true;
                directionalLight.shadow.mapSize.width = 2048;
                directionalLight.shadow.mapSize.height = 2048;
                this.scene.add(directionalLight);
                
                // Add grid helper
                this.gridHelper = new THREE.GridHelper(100, 100, 0x444444, 0x222222);
                this.scene.add(this.gridHelper);
                
                // Start animation loop
                this.animate();
                
                // Handle window resize
                window.addEventListener('resize', () => this.onWindowResize());
            }
            
            animate() {
                requestAnimationFrame(() => this.animate());
                this.controls.update();
                this.renderer.render(this.scene, this.camera);
            }
            
            onWindowResize() {
                this.camera.aspect = window.innerWidth * 0.7 / (window.innerHeight * 0.8);
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth * 0.7, window.innerHeight * 0.8);
            }
            
            setupEventListeners() {
                // View controls
                document.getElementById('floorSelect').addEventListener('change', (e) => {
                    this.currentFloor = e.target.value;
                    this.updateView();
                });
                
                document.getElementById('floorHeight').addEventListener('input', (e) => {
                    this.floorHeight = parseFloat(e.target.value);
                    document.getElementById('floorHeightValue').textContent = this.floorHeight;
                    this.updateView();
                });
                
                document.getElementById('wallHeight').addEventListener('input', (e) => {
                    this.wallHeight = parseFloat(e.target.value);
                    document.getElementById('wallHeightValue').textContent = this.wallHeight;
                    this.updateView();
                });
                
                document.getElementById('showLabels').addEventListener('change', (e) => {
                    this.showLabels = e.target.checked;
                    this.updateView();
                });
                
                document.getElementById('showGrid').addEventListener('change', (e) => {
                    this.showGrid = e.target.checked;
                    this.gridHelper.visible = this.showGrid;
                });
                
                document.getElementById('showWalls').addEventListener('change', (e) => {
                    this.showWalls = e.target.checked;
                    this.updateView();
                });
                
                document.getElementById('colorScheme').addEventListener('change', (e) => {
                    this.colorScheme = e.target.value;
                    this.updateView();
                });
                
                document.getElementById('viewMode').addEventListener('change', (e) => {
                    this.viewMode = e.target.value;
                    this.updateView();
                });
                
                document.getElementById('resetView').addEventListener('click', () => {
                    this.camera.position.set(20, 15, 20);
                    this.controls.reset();
                });
            }
            
            createSampleData() {
                // Create sample room data for demonstration
                // In your app, this would come from your JSON data
                this.rooms = [
                    {
                        roomName: "Living Room",
                        applicableFloors: 0,
                        vertices: [
                            {X: 0, Y: 0},
                            {X: 8, Y: 0},
                            {X: 8, Y: 6},
                            {X: 0, Y: 6}
                        ]
                    },
                    {
                        roomName: "Kitchen",
                        applicableFloors: 0,
                        vertices: [
                            {X: 8, Y: 0},
                            {X: 12, Y: 0},
                            {X: 12, Y: 4},
                            {X: 8, Y: 4}
                        ]
                    },
                    {
                        roomName: "Bedroom 1",
                        applicableFloors: 1,
                        vertices: [
                            {X: 0, Y: 0},
                            {X: 6, Y: 0},
                            {X: 6, Y: 5},
                            {X: 0, Y: 5}
                        ]
                    },
                    {
                        roomName: "Bedroom 2",
                        applicableFloors: 1,
                        vertices: [
                            {X: 6, Y: 0},
                            {X: 12, Y: 0},
                            {X: 12, Y: 5},
                            {X: 6, Y: 5}
                        ]
                    },
                    {
                        roomName: "Bathroom",
                        applicableFloors: 1,
                        vertices: [
                            {X: 0, Y: 5},
                            {X: 4, Y: 5},
                            {X: 4, Y: 7},
                            {X: 0, Y: 7}
                        ]
                    },
                    {
                        roomName: "Office",
                        applicableFloors: 2,
                        vertices: [
                            {X: 0, Y: 0},
                            {X: 8, Y: 0},
                            {X: 8, Y: 6},
                            {X: 0, Y: 6}
                        ]
                    },
                    {
                        roomName: "Storage",
                        applicableFloors: 2,
                        vertices: [
                            {X: 8, Y: 0},
                            {X: 12, Y: 0},
                            {X: 12, Y: 4},
                            {X: 8, Y: 4}
                        ]
                    }
                ];
            }
            
            create3DVisualization() {
                if (this.rooms.length === 0) return;
                
                // Group rooms by floor
                const roomsByFloor = {};
                this.rooms.forEach(room => {
                    const floor = room.applicableFloors || 0;
                    if (!roomsByFloor[floor]) roomsByFloor[floor] = [];
                    roomsByFloor[floor].push(room);
                });
                
                // Create floors
                Object.keys(roomsByFloor).forEach(floor => {
                    const floorNum = parseInt(floor);
                    const floorY = floorNum * this.floorHeight;
                    
                    // Create floor plane
                    const floorGeometry = new THREE.PlaneGeometry(100, 100);
                    const floorMaterial = new THREE.MeshLambertMaterial({ 
                        color: 0xcccccc, 
                        transparent: true, 
                        opacity: 0.5 
                    });
                    const floorMesh = new THREE.Mesh(floorGeometry, floorMaterial);
                    floorMesh.rotation.x = -Math.PI / 2;
                    floorMesh.position.y = floorY;
                    floorMesh.receiveShadow = true;
                    this.scene.add(floorMesh);
                    
                    // Add floor label
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = 256;
                    canvas.height = 128;
                    context.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    context.fillRect(0, 0, canvas.width, canvas.height);
                    context.font = 'bold 48px Arial';
                    context.fillStyle = 'white';
                    context.textAlign = 'center';
                    context.fillText(`Floor ${floor}`, canvas.width / 2, canvas.height / 2 + 15);
                    
                    const texture = new THREE.CanvasTexture(canvas);
                    const labelMaterial = new THREE.SpriteMaterial({ map: texture });
                    const label = new THREE.Sprite(labelMaterial);
                    label.position.set(-40, floorY + 0.1, -40);
                    label.scale.set(20, 10, 1);
                    this.scene.add(label);
                    
                    // Create rooms for this floor
                    roomsByFloor[floor].forEach(room => {
                        this.createRoom3D(room, floorY);
                    });
                });
                
                // Adjust camera to fit all content
                this.fitCameraToScene();
            }
            
            createRoom3D(room, floorY) {
                const vertices = room.vertices.map(v => new THREE.Vector3(v.X, 0, v.Y));
                
                // Create floor
                const shape = new THREE.Shape();
                shape.moveTo(vertices[0].x, vertices[0].z);
                for (let i = 1; i < vertices.length; i++) {
                    shape.lineTo(vertices[i].x, vertices[i].z);
                }
                
                const floorGeometry = new THREE.ShapeGeometry(shape);
                const floorMaterial = new THREE.MeshLambertMaterial({ 
                    color: this.getRoomColor(room),
                    side: THREE.DoubleSide
                });
                const floorMesh = new THREE.Mesh(floorGeometry, floorMaterial);
                floorMesh.position.y = floorY;
                floorMesh.rotation.x = -Math.PI / 2;
                floorMesh.receiveShadow = true;
                this.scene.add(floorMesh);
                
                // Create walls if enabled
                if (this.showWalls) {
                    for (let i = 0; i < vertices.length; i++) {
                        const start = vertices[i];
                        const end = vertices[(i + 1) % vertices.length];
                        
                        const wallGeometry = new THREE.PlaneGeometry(
                            start.distanceTo(end), 
                            this.wallHeight
                        );
                        const wallMaterial = new THREE.MeshLambertMaterial({ 
                            color: 0xaaaaaa,
                            side: THREE.DoubleSide
                        });
                        const wallMesh = new THREE.Mesh(wallGeometry, wallMaterial);
                        
                        // Position the wall
                        wallMesh.position.set(
                            (start.x + end.x) / 2,
                            floorY + this.wallHeight / 2,
                            (start.z + end.z) / 2
                        );
                        
                        // Rotate the wall to face outward
                        const direction = new THREE.Vector3().subVectors(end, start).normalize();
                        const angle = Math.atan2(direction.x, direction.z);
                        wallMesh.rotation.y = angle;
                        
                        wallMesh.castShadow = true;
                        wallMesh.receiveShadow = true;
                        this.scene.add(wallMesh);
                    }
                }
                
                // Add room label if enabled
                if (this.showLabels && room.roomName) {
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = 256;
                    canvas.height = 64;
                    
                    context.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    context.fillRect(0, 0, canvas.width, canvas.height);
                    
                    context.font = 'bold 24px Arial';
                    context.fillStyle = 'white';
                    context.textAlign = 'center';
                    context.fillText(room.roomName, canvas.width / 2, canvas.height / 2 + 8);
                    
                    const texture = new THREE.CanvasTexture(canvas);
                    const labelMaterial = new THREE.SpriteMaterial({ map: texture });
                    const label = new THREE.Sprite(labelMaterial);
                    
                    // Calculate centroid for label position
                    const centroid = new THREE.Vector3();
                    vertices.forEach(v => centroid.add(v));
                    centroid.divideScalar(vertices.length);
                    
                    label.position.set(centroid.x, floorY + this.wallHeight + 0.5, centroid.z);
                    label.scale.set(5, 1.25, 1);
                    this.scene.add(label);
                }
            }
            
            getRoomColor(room) {
                // Generate color based on selected scheme
                switch (this.colorScheme) {
                    case 'byRoomType':
                        // Simple hash based on room name
                        let hash = 0;
                        for (let i = 0; i < (room.roomName || '').length; i++) {
                            hash = room.roomName.charCodeAt(i) + ((hash << 5) - hash);
                        }
                        const color = (hash & 0x00FFFFFF).toString(16).toUpperCase();
                        return parseInt('0x' + '00000'.substring(0, 6 - color.length) + color);
                    
                    case 'byFloor':
                        // Different color for each floor
                        const floor = room.applicableFloors || 0;
                        const colors = [0xff6b6b, 0x4ecdc4, 0x45b7d1, 0x96ceb4, 0xfeca57, 0xff9ff3];
                        return colors[floor % colors.length];
                    
                    case 'monochrome':
                    default:
                        return 0xdddddd;
                }
            }
            
            updateView() {
                // Clear and recreate the visualization with new settings
                this.clearScene();
                this.create3DVisualization();
            }
            
            clearScene() {
                // Remove all objects except lights, grid, and axes
                const objectsToRemove = [];
                this.scene.traverse(child => {
                    if (child.isMesh || child.isSprite) {
                        objectsToRemove.push(child);
                    }
                });
                
                objectsToRemove.forEach(obj => {
                    this.scene.remove(obj);
                    if (obj.geometry) obj.geometry.dispose();
                    if (obj.material) {
                        if (Array.isArray(obj.material)) {
                            obj.material.forEach(material => material.dispose());
                        } else {
                            obj.material.dispose();
                        }
                    }
                });
            }
            
            fitCameraToScene() {
                const box = new THREE.Box3().setFromObject(this.scene);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                const maxDim = Math.max(size.x, size.y, size.z);
                const fov = this.camera.fov * (Math.PI / 180);
                let cameraZ = Math.abs(maxDim / Math.sin(fov / 2));
                
                // Adjust for floor height
                cameraZ += this.floorHeight * 2;
                
                this.camera.position.set(center.x, center.y + cameraZ * 0.5, center.z + cameraZ);
                this.controls.target.set(center.x, center.y, center.z);
                this.controls.update();
            }
            
            showToast(message) {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.style.opacity = 1;
                
                setTimeout(() => {
                    toast.style.opacity = 0;
                }, 3000);
            }
        }
        
        // Initialize the 3D viewer when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new Building3DViewer();
        });
    </script>
</body>
</html>
